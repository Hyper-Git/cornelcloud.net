<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cornel Bacanu | Cloud Engineer Journey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Overlay UI */
        .overlay {
            position: fixed;
            z-index: 10;
            pointer-events: none;
        }

        /* Top bar */
        .top-bar {
            top: 0;
            left: 0;
            right: 0;
            padding: 2rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #00d4ff;
            font-size: 0.85rem;
            font-family: 'Courier New', monospace;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00d4ff;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 10px #00d4ff; }
            50% { opacity: 0.5; box-shadow: 0 0 20px #00d4ff; }
        }

        /* Center content */
        .center-content {
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            max-width: 900px;
        }

        .subtitle-box {
            background: rgba(0, 20, 40, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 20px;
            padding: 2.5rem 3rem;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .subtitle-box.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .subtitle-text {
            color: #fff;
            font-size: 1.8rem;
            line-height: 1.6;
            font-weight: 300;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        .subtitle-text .highlight {
            color: #00d4ff;
            font-weight: 500;
        }

        .subtitle-text .highlight-purple {
            color: #a78bfa;
            font-weight: 500;
        }

        .subtitle-text .highlight-orange {
            color: #fb923c;
            font-weight: 500;
        }

        /* Progress bar */
        .progress-container {
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d4ff, #7c3aed, #f97316);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 0.75rem;
            color: rgba(255,255,255,0.5);
            font-size: 0.8rem;
            font-family: 'Courier New', monospace;
        }

        /* Start screen */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #0a1628 0%, #000 100%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease, visibility 1s ease;
        }

        .start-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .start-title {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #00d4ff 0%, #7c3aed 50%, #f97316 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
            text-align: center;
        }

        .start-subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 1.2rem;
            margin-bottom: 3rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .start-button {
            padding: 1.2rem 3rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #000;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .start-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.5);
        }

        .start-note {
            margin-top: 2rem;
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
        }

        /* HUD elements */
        .hud-left {
            top: 50%;
            left: 2rem;
            transform: translateY(-50%);
        }

        .hud-item {
            margin-bottom: 2rem;
            opacity: 0.6;
        }

        .hud-label {
            font-size: 0.7rem;
            color: #00d4ff;
            letter-spacing: 2px;
            margin-bottom: 0.3rem;
            font-family: 'Courier New', monospace;
        }

        .hud-value {
            font-size: 1.5rem;
            color: #fff;
            font-weight: 300;
        }

        /* Scene indicator */
        .scene-indicator {
            bottom: 3rem;
            right: 3rem;
            text-align: right;
        }

        .scene-number {
            font-size: 4rem;
            font-weight: 700;
            background: linear-gradient(135deg, rgba(0,212,255,0.3), rgba(124,58,237,0.3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .scene-title {
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Controls */
        .controls {
            bottom: 3rem;
            left: 3rem;
            display: flex;
            gap: 1rem;
            pointer-events: auto;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .control-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
        }

        .control-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Floating particles CSS */
        .floating-text {
            position: absolute;
            color: rgba(0, 212, 255, 0.4);
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            pointer-events: none;
            animation: floatText 20s linear infinite;
        }

        @keyframes floatText {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* Scan line effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1) 0px,
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 3px
            );
            opacity: 0.3;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .start-title { font-size: 2rem; }
            .subtitle-text { font-size: 1.2rem; }
            .top-bar { padding: 1rem 1.5rem; }
            .hud-left { display: none; }
            .scene-indicator { display: none; }
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="scanlines"></div>

    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <h1 class="start-title">CORNEL BACANU</h1>
        <p class="start-subtitle">Cloud Engineer • AI Enthusiast</p>
        <button class="start-button" onclick="startPresentation()">
            Begin Journey
        </button>
        <p class="start-note">🔊 Enable sound for the full experience</p>
    </div>

    <!-- Top Bar -->
    <div class="overlay top-bar">
        <div class="logo">CORNELCLOUD</div>
        <div class="status">
            <div class="status-dot"></div>
            <span>SYSTEM ONLINE</span>
        </div>
    </div>

    <!-- Center Subtitles -->
    <div class="overlay center-content">
        <div class="subtitle-box" id="subtitleBox">
            <p class="subtitle-text" id="subtitleText"></p>
        </div>
    </div>

    <!-- HUD Left -->
    <div class="overlay hud-left">
        <div class="hud-item">
            <div class="hud-label">CERTIFICATION</div>
            <div class="hud-value">AWS CCP</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">SPECIALIZATION</div>
            <div class="hud-value">Cloud</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">STATUS</div>
            <div class="hud-value">Available</div>
        </div>
    </div>

    <!-- Scene Indicator -->
    <div class="overlay scene-indicator">
        <div class="scene-number" id="sceneNumber">01</div>
        <div class="scene-title" id="sceneTitle">INTRODUCTION</div>
    </div>

    <!-- Progress Bar -->
    <div class="overlay progress-container">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-text">
            <span id="currentTime">00:00</span>
            <span id="totalTime">02:00</span>
        </div>
    </div>

    <!-- Controls -->
    <div class="overlay controls">
        <button class="control-btn" id="playPauseBtn" onclick="togglePlayPause()">
            <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon">
                <path d="M8 5v14l11-7z"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="currentColor" id="pauseIcon" style="display:none">
                <rect x="6" y="4" width="4" height="16"/>
                <rect x="14" y="4" width="4" height="16"/>
            </svg>
        </button>
        <button class="control-btn" onclick="restartPresentation()">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            </svg>
        </button>
        <button class="control-btn" id="muteBtn" onclick="toggleMute()">
            <svg viewBox="0 0 24 24" fill="currentColor" id="soundOnIcon">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="currentColor" id="soundOffIcon" style="display:none">
                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
        </button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Presentation State
        let isPlaying = false;
        let isMuted = false;
        let currentScene = 0;
        let currentTime = 0;
        let totalDuration = 120; // 2 minutes
        let speechSynth = window.speechSynthesis;
        let currentUtterance = null;

        // Scene data with narration and timing
        const scenes = [
            {
                id: 1,
                title: "INTRODUCTION",
                startTime: 0,
                duration: 15,
                text: `Hi, I'm <span class="highlight">Cornel Bacanu</span>, and I build things — I always have.`,
                narration: "Hi, I'm Cornel Bacanu, and I build things — I always have."
            },
            {
                id: 2,
                title: "THE FOUNDATION",
                startTime: 15,
                duration: 20,
                text: `For years, I worked in <span class="highlight-orange">kitchen installation</span>. Every project was a puzzle: measuring twice, planning for problems, and making sure every piece fit perfectly.`,
                narration: "For years, I worked in kitchen installation. Every project was a puzzle: measuring twice, planning for problems, and making sure every piece fit perfectly."
            },
            {
                id: 3,
                title: "THE DISCOVERY",
                startTime: 35,
                duration: 18,
                text: `Then I discovered <span class="highlight">cloud computing</span> — and realised I'd been training for it my whole career without knowing it.`,
                narration: "Then I discovered cloud computing — and realised I'd been training for it my whole career without knowing it."
            },
            {
                id: 4,
                title: "THE CONNECTION",
                startTime: 53,
                duration: 22,
                text: `Cloud architecture is <span class="highlight-purple">installation at a different scale</span>. Instead of fitting cabinets, I'm fitting services. Instead of planning plumbing, I'm designing data flows.`,
                narration: "Cloud architecture is installation at a different scale. Instead of fitting cabinets into tight corners, I'm fitting services into infrastructure. Instead of planning plumbing routes, I'm designing data flows."
            },
            {
                id: 5,
                title: "CREDENTIALS",
                startTime: 75,
                duration: 22,
                text: `I'm <span class="highlight">AWS Certified</span>, building with <span class="highlight-purple">Terraform</span>, <span class="highlight-orange">Docker</span>, and serverless architectures. I'm exploring <span class="highlight">AI integration</span> with Amazon Bedrock.`,
                narration: "I've earned my AWS Cloud Practitioner certification. I build infrastructure with Terraform, containerize with Docker, and create serverless architectures with Lambda. I'm particularly excited about AI integration with Amazon Bedrock."
            },
            {
                id: 6,
                title: "THE VALUE",
                startTime: 97,
                duration: 15,
                text: `I bring a <span class="highlight-purple">problem-solver's mindset</span> shaped by years of real-world project delivery. I understand deadlines, client expectations, and getting things right.`,
                narration: "What I bring isn't just technical skills — it's a problem-solver's mindset, shaped by years of real-world project delivery. I understand deadlines, client expectations, and the importance of getting things right."
            },
            {
                id: 7,
                title: "THE FUTURE",
                startTime: 112,
                duration: 8,
                text: `I'm ready to bring this unique perspective to <span class="highlight">cloud engineering</span>. <span class="highlight-orange">Let's connect.</span>`,
                narration: "I'm ready to bring this unique perspective to cloud engineering. Let's connect and build something amazing together."
            }
        ];

        // Three.js Setup
        let scene, camera, renderer, particles, cloudNodes = [], dataStreams = [], gridHelper;
        let animationId;

        function initThreeJS() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000814, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 30);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Ambient light
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);

            // Point lights
            const light1 = new THREE.PointLight(0x00d4ff, 2, 100);
            light1.position.set(20, 20, 20);
            scene.add(light1);

            const light2 = new THREE.PointLight(0x7c3aed, 2, 100);
            light2.position.set(-20, 10, -20);
            scene.add(light2);

            const light3 = new THREE.PointLight(0xf97316, 1, 100);
            light3.position.set(0, -10, 30);
            scene.add(light3);

            // Create infinite grid
            createGrid();

            // Create cloud nodes (representing servers/services)
            createCloudNodes();

            // Create particle system
            createParticles();

            // Create data streams
            createDataStreams();

            // Create floating holographic rings
            createHoloRings();

            window.addEventListener('resize', onWindowResize);
        }

        function createGrid() {
            const gridGeometry = new THREE.PlaneGeometry(200, 200, 50, 50);
            const gridMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    color1: { value: new THREE.Color(0x00d4ff) },
                    color2: { value: new THREE.Color(0x7c3aed) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    varying float vElevation;
                    uniform float time;
                    void main() {
                        vUv = uv;
                        vec3 pos = position;
                        float wave = sin(pos.x * 0.1 + time) * cos(pos.y * 0.1 + time) * 2.0;
                        pos.z = wave;
                        vElevation = wave;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                    }
                `,
                fragmentShader: `
                    varying vec2 vUv;
                    varying float vElevation;
                    uniform vec3 color1;
                    uniform vec3 color2;
                    void main() {
                        float line = step(0.95, fract(vUv.x * 50.0)) + step(0.95, fract(vUv.y * 50.0));
                        vec3 color = mix(color1, color2, vElevation * 0.2 + 0.5);
                        float alpha = line * 0.3 * (1.0 - length(vUv - 0.5) * 1.5);
                        gl_FragColor = vec4(color, alpha);
                    }
                `,
                transparent: true,
                side: THREE.DoubleSide
            });

            gridHelper = new THREE.Mesh(gridGeometry, gridMaterial);
            gridHelper.rotation.x = -Math.PI / 2;
            gridHelper.position.y = -10;
            scene.add(gridHelper);
        }

        function createCloudNodes() {
            const nodeGeometry = new THREE.IcosahedronGeometry(1.5, 1);
            const nodeMaterial = new THREE.MeshPhongMaterial({
                color: 0x00d4ff,
                emissive: 0x00d4ff,
                emissiveIntensity: 0.3,
                transparent: true,
                opacity: 0.8,
                wireframe: true
            });

            const positions = [
                { x: -15, y: 5, z: -10 },
                { x: 15, y: 8, z: -15 },
                { x: 0, y: 12, z: -20 },
                { x: -20, y: 3, z: 5 },
                { x: 20, y: 6, z: 0 },
                { x: -8, y: 15, z: -25 },
                { x: 12, y: 2, z: 10 },
                { x: -5, y: 10, z: -5 }
            ];

            const colors = [0x00d4ff, 0x7c3aed, 0xf97316];

            positions.forEach((pos, i) => {
                const material = nodeMaterial.clone();
                material.color.setHex(colors[i % colors.length]);
                material.emissive.setHex(colors[i % colors.length]);

                const node = new THREE.Mesh(nodeGeometry, material);
                node.position.set(pos.x, pos.y, pos.z);
                node.userData = { 
                    originalY: pos.y, 
                    speed: 0.5 + Math.random() * 0.5,
                    phase: Math.random() * Math.PI * 2
                };

                // Add inner solid core
                const coreGeometry = new THREE.IcosahedronGeometry(0.8, 1);
                const coreMaterial = new THREE.MeshPhongMaterial({
                    color: colors[i % colors.length],
                    emissive: colors[i % colors.length],
                    emissiveIntensity: 0.5
                });
                const core = new THREE.Mesh(coreGeometry, coreMaterial);
                node.add(core);

                scene.add(node);
                cloudNodes.push(node);
            });
        }

        function createParticles() {
            const particleCount = 2000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const colorOptions = [
                new THREE.Color(0x00d4ff),
                new THREE.Color(0x7c3aed),
                new THREE.Color(0xf97316)
            ];

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 150;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 100;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 150;

                const color = colorOptions[Math.floor(Math.random() * colorOptions.length)];
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }

        function createDataStreams() {
            // Create flowing data stream lines between nodes
            for (let i = 0; i < cloudNodes.length - 1; i++) {
                const start = cloudNodes[i].position;
                const end = cloudNodes[(i + 1) % cloudNodes.length].position;

                const curve = new THREE.QuadraticBezierCurve3(
                    start.clone(),
                    new THREE.Vector3(
                        (start.x + end.x) / 2 + (Math.random() - 0.5) * 10,
                        (start.y + end.y) / 2 + 5,
                        (start.z + end.z) / 2
                    ),
                    end.clone()
                );

                const points = curve.getPoints(50);
                const geometry = new THREE.BufferGeometry().setFromPoints(points);
                
                const material = new THREE.LineBasicMaterial({
                    color: 0x00d4ff,
                    transparent: true,
                    opacity: 0.3
                });

                const line = new THREE.Line(geometry, material);
                scene.add(line);
                dataStreams.push({ line, curve, progress: Math.random() });
            }
        }

        function createHoloRings() {
            const ringGeometry = new THREE.TorusGeometry(3, 0.05, 16, 100);
            
            for (let i = 0; i < 3; i++) {
                const material = new THREE.MeshBasicMaterial({
                    color: [0x00d4ff, 0x7c3aed, 0xf97316][i],
                    transparent: true,
                    opacity: 0.4
                });

                const ring = new THREE.Mesh(ringGeometry, material);
                ring.position.set(0, 10, -15);
                ring.rotation.x = Math.PI / 2 + i * 0.3;
                ring.scale.setScalar(1 + i * 0.5);
                ring.userData = { rotationSpeed: 0.01 + i * 0.005 };
                scene.add(ring);
                cloudNodes.push(ring); // Reuse for animation
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            animationId = requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // Update grid shader
            if (gridHelper && gridHelper.material.uniforms) {
                gridHelper.material.uniforms.time.value = time;
            }

            // Animate cloud nodes
            cloudNodes.forEach((node, i) => {
                if (node.userData.originalY !== undefined) {
                    node.position.y = node.userData.originalY + 
                        Math.sin(time * node.userData.speed + node.userData.phase) * 2;
                    node.rotation.x += 0.005;
                    node.rotation.y += 0.01;
                }
                if (node.userData.rotationSpeed) {
                    node.rotation.z += node.userData.rotationSpeed;
                }
            });

            // Animate particles
            if (particles) {
                particles.rotation.y += 0.0005;
                const positions = particles.geometry.attributes.position.array;
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i + 1] += 0.02;
                    if (positions[i + 1] > 50) positions[i + 1] = -50;
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }

            // Camera movement based on scene
            const targetX = Math.sin(time * 0.1) * 5;
            const targetY = 5 + Math.sin(time * 0.15) * 2;
            camera.position.x += (targetX - camera.position.x) * 0.01;
            camera.position.y += (targetY - camera.position.y) * 0.01;
            camera.lookAt(0, 5, -10);

            renderer.render(scene, camera);
        }

        // Presentation Logic
        function startPresentation() {
            document.getElementById('startScreen').classList.add('hidden');
            isPlaying = true;
            updatePlayPauseButton();
            playCurrentScene();
            startTimer();
        }

        function playCurrentScene() {
            if (currentScene >= scenes.length) {
                endPresentation();
                return;
            }

            const sceneData = scenes[currentScene];
            
            // Update UI
            document.getElementById('sceneNumber').textContent = String(sceneData.id).padStart(2, '0');
            document.getElementById('sceneTitle').textContent = sceneData.title;
            
            // Show subtitle
            const subtitleBox = document.getElementById('subtitleBox');
            const subtitleText = document.getElementById('subtitleText');
            
            subtitleBox.classList.remove('visible');
            
            setTimeout(() => {
                subtitleText.innerHTML = sceneData.text;
                subtitleBox.classList.add('visible');
            }, 300);

            // Speak narration
            if (!isMuted) {
                speakText(sceneData.narration, sceneData.duration);
            }

            // Schedule next scene
            setTimeout(() => {
                if (isPlaying) {
                    currentScene++;
                    playCurrentScene();
                }
            }, sceneData.duration * 1000);
        }

        function speakText(text, duration) {
            if (speechSynth.speaking) {
                speechSynth.cancel();
            }

            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.rate = 0.9;
            currentUtterance.pitch = 1;
            currentUtterance.volume = 1;

            // Try to find a good voice
            const voices = speechSynth.getVoices();
            const preferredVoice = voices.find(v => 
                v.name.includes('Google') || 
                v.name.includes('Daniel') || 
                v.name.includes('James') ||
                v.lang.startsWith('en')
            );
            if (preferredVoice) {
                currentUtterance.voice = preferredVoice;
            }

            speechSynth.speak(currentUtterance);
        }

        let timerInterval;
        function startTimer() {
            timerInterval = setInterval(() => {
                if (isPlaying) {
                    currentTime++;
                    updateProgress();
                    if (currentTime >= totalDuration) {
                        endPresentation();
                    }
                }
            }, 1000);
        }

        function updateProgress() {
            const progress = (currentTime / totalDuration) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('currentTime').textContent = formatTime(currentTime);
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function togglePlayPause() {
            isPlaying = !isPlaying;
            updatePlayPauseButton();
            
            if (isPlaying) {
                playCurrentScene();
            } else {
                speechSynth.cancel();
            }
        }

        function updatePlayPauseButton() {
            document.getElementById('playIcon').style.display = isPlaying ? 'none' : 'block';
            document.getElementById('pauseIcon').style.display = isPlaying ? 'block' : 'none';
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('soundOnIcon').style.display = isMuted ? 'none' : 'block';
            document.getElementById('soundOffIcon').style.display = isMuted ? 'block' : 'none';
            
            if (isMuted) {
                speechSynth.cancel();
            }
        }

        function restartPresentation() {
            speechSynth.cancel();
            clearInterval(timerInterval);
            currentScene = 0;
            currentTime = 0;
            isPlaying = true;
            updatePlayPauseButton();
            updateProgress();
            playCurrentScene();
            startTimer();
        }

        function endPresentation() {
            isPlaying = false;
            updatePlayPauseButton();
            clearInterval(timerInterval);
            speechSynth.cancel();
            
            document.getElementById('subtitleText').innerHTML = `
                <span class="highlight">Thank you for watching.</span><br><br>
                <span style="font-size: 1.2rem;">Let's connect and build the future together.</span>
            `;
        }

        // Initialize
        window.addEventListener('load', () => {
            initThreeJS();
            animate();
            
            // Load voices
            speechSynth.getVoices();
            speechSynth.onvoiceschanged = () => speechSynth.getVoices();
        });
    </script>
</body>
</html>
